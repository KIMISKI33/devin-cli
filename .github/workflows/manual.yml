name: Run My Custom Tasks
on:
  workflow_dispatch:

jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4.2.2 # Updated to patch Node deprecation

      - name: Set up Python Environment
        uses: actions/setup-python@v5.3.0 # Updated to patch Node deprecation
        with:
          python-version: '3.x'

      - name: Set up Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Execute Python Test Suite
        run: |
          echo "Executing test_recon_suite.py with verbose logs..."
          # Adding the -v flag forces Python to print exactly which test is failing
          python -m unittest -v tests.test_recon_suite
